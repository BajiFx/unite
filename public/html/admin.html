<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .login-box {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.06);
            border: 1px solid #eef2f6;
        }
        .login-box .icon { font-size: 3rem; margin-bottom: 12px; }
        .login-box h1 { font-size: 1.4rem; font-weight: 800; color: #0f172a; }
        .login-box .sub { color: #64748b; font-size: 0.9rem; margin-bottom: 24px; }
        .login-box .form-group { margin-bottom: 14px; text-align: left; }
        .login-box .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.8rem;
            color: #334155;
            margin-bottom: 4px;
        }
        .login-box .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }
        .login-box .form-group input:focus {
            border-color: #2563eb;
            outline: none;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.08);
        }
        .login-box .form-group .toggle-pwd {
            position: absolute;
            right: 12px;
            bottom: 12px;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
        }
        .login-box .btn {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .login-box .btn:hover { background: #1d4ed8; }
        .login-box .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .login-box .status {
            margin-top: 12px;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            text-align: center;
            display: none;
        }
        .login-box .status.error { display: block; background: #fef2f2; color: #991b1b; }
        .login-box .status.success { display: block; background: #f0fdf4; color: #166534; }
        .login-box .status.loading { display: block; background: #eff6ff; color: #1e40af; }
        .login-box .note {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #e2e8f0;
            font-size: 0.8rem;
            color: #94a3b8;
        }
        .login-box .note a { color: #2563eb; text-decoration: none; font-weight: 600; }
        .login-box .note a:hover { text-decoration: underline; }
        .login-box .business-links {
            margin-top: 12px;
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .login-box .business-links a {
            font-size: 0.8rem;
            color: #64748b;
            text-decoration: none;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            transition: all 0.2s;
        }
        .login-box .business-links a:hover {
            border-color: #2563eb;
            color: #2563eb;
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .pwd-wrapper { position: relative; }
    </style>
</head>
<body>

<div class="login-box" id="loginBox">
    <div class="icon">🔐</div>
    <h1>Super Admin</h1>
    <p class="sub">Platform administrators only</p>

    <div id="loginForm">
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="admin@example.com">
        </div>
        <div class="form-group pwd-wrapper">
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="Enter your password">
            <button class="toggle-pwd" onclick="togglePassword()"><i class="fas fa-eye" id="toggleIcon"></i></button>
        </div>
        <button class="btn" id="loginBtn" onclick="handleLogin()">Login</button>
        <div id="status" class="status"></div>
    </div>

    <div class="business-links">
        <a href="/business-login.html">🏪 Business Login</a>
        <a href="/register-business.html">📝 Register Business</a>
        <a href="/">🏠 Back to Marketplace</a>
    </div>

    <div class="note">
        Business owners should use the <a href="/business-login.html">Business Admin Panel</a>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></script>
<script src="/js/cookie-auth-client.js"></script>
<script>
    // Toggle password visibility
    function togglePassword() {
        const pwd = document.getElementById('loginPassword');
        const icon = document.getElementById('toggleIcon');
        if (pwd.type === 'password') {
            pwd.type = 'text';
            icon.className = 'fas fa-eye-slash';
        } else {
            pwd.type = 'password';
            icon.className = 'fas fa-eye';
        }
    }

    // Handle login
    async function handleLogin() {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const status = document.getElementById('status');
        const btn = document.getElementById('loginBtn');

        // Reset status
        status.className = 'status';
        status.textContent = '';

        if (!email || !password) {
            status.className = 'status error';
            status.textContent = '❌ Email and password are required.';
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Logging in...';
        status.className = 'status loading';
        status.textContent = '⏳ Verifying credentials...';

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await res.json();

            if (res.ok && data.success) {
                status.className = 'status success';
                status.textContent = '✅ Login successful! Redirecting...';

                setTimeout(() => {
                    window.location.href = '/admin-dashboard.html';
                }, 1500);
            } else {
                status.className = 'status error';
                status.textContent = '❌ ' + (data.error || 'Invalid credentials. Please try again.');
                btn.disabled = false;
                btn.innerHTML = 'Login';
            }
        } catch (err) {
            status.className = 'status error';
            status.textContent = '❌ Network error. Please try again.';
            btn.disabled = false;
            btn.innerHTML = 'Login';
        }
    }

    // Enter key support
    document.getElementById('loginPassword').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') handleLogin();
    });
    document.getElementById('loginEmail').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') handleLogin();
    });
</script>
</body>
</html>
