<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Business Login</title>

  <!-- Global Styles -->
  <link rel="stylesheet" href="/style.css">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    /* Additional login styles */
    .business-login-page {
      max-width: 420px;
      margin: 40px auto;
      padding: 0 16px;
    }
    .login-card {
      background: white;
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      border: 1px solid #eef2f6;
    }
    .login-card .icon {
      text-align: center;
      font-size: 3rem;
      margin-bottom: 8px;
    }
    .login-card h1 {
      text-align: center;
      font-size: 1.4rem;
      font-weight: 800;
      color: #0f172a;
    }
    .login-card .sub {
      text-align: center;
      color: #64748b;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }
    .login-card .form-group {
      margin-bottom: 14px;
    }
    .login-card .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.8rem;
      color: #334155;
      margin-bottom: 4px;
    }
    .login-card .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }
    .login-card .form-group input:focus {
      border-color: #22c55e;
      outline: none;
      box-shadow: 0 0 0 3px rgba(34,197,94,0.08);
    }
    .login-card .pwd-wrapper {
      position: relative;
    }
    .login-card .toggle-pwd {
      position: absolute;
      right: 12px;
      bottom: 12px;
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
    }
    .login-card .btn-login {
      width: 100%;
      padding: 12px;
      background: #22c55e;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .login-card .btn-login:hover {
      background: #16a34a;
    }
    .login-card .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .login-card .status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      text-align: center;
      display: none;
    }
    .login-card .status.error {
      display: block;
      background: #fef2f2;
      color: #991b1b;
    }
    .login-card .status.success {
      display: block;
      background: #f0fdf4;
      color: #166534;
    }
    .login-card .status.loading {
      display: block;
      background: #eff6ff;
      color: #1e40af;
    }
    .login-card .links {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
      text-align: center;
      font-size: 0.85rem;
      color: #64748b;
    }
    .login-card .links a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }
    .login-card .links a:hover {
      text-decoration: underline;
    }
    .login-card .footer-links {
      margin-top: 12px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .login-card .footer-links a {
      font-size: 0.8rem;
      color: #94a3b8;
      text-decoration: none;
    }
    .login-card .footer-links a:hover {
      color: #2563eb;
    }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .header {
      background: #ffffff;
      padding: 10px 14px;
      border-bottom: 1px solid #e8ecf1;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      font-weight: 800;
      font-size: 1.1rem;
      color: #0f172a;
    }
    .header a {
      color: #64748b;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.75rem;
    }
    .header a:hover {
      color: #2563eb;
    }
  </style>
</head>
<body>

<!-- ===== HEADER ===== -->
<div class="header">
  <h1>🛍️ <span>Shop Kenya</span></h1>
  <div>
    <a href="/">Home</a>
    <a href="/register-business.html" style="margin-left:12px;">Register</a>
  </div>
</div>

<!-- ===== LOGIN FORM ===== -->
<div class="business-login-page">
  <div class="login-card">
    <div class="icon">🏪</div>
    <h1>Business Login</h1>
    <p class="sub">Login to manage your business</p>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="business@email.com" required>
      </div>
      <div class="form-group pwd-wrapper">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Enter your password" required>
        <button type="button" class="toggle-pwd" onclick="togglePassword()">
          <i class="fas fa-eye" id="toggleIcon"></i>
        </button>
      </div>
      <button type="submit" class="btn-login" id="loginBtn">
        <i class="fas fa-sign-in-alt"></i> Login
      </button>
      <div id="status" class="status"></div>
    </form>

    <div class="links">
      Don't have a business? <a href="/register-business.html">Register your business</a>
    </div>

    <div class="footer-links">
      <a href="/">🏠 Marketplace</a>
      <a href="/reset-password.html">🔑 Forgot Password?</a>
      <a href="/admin.html">🔐 Super Admin</a>
    </div>
  </div>
</div>

<!-- ===== BOTTOM NAV ===== -->
<div class="bottom-nav">
  <a href="/"><i class="fas fa-home"></i><span>Home</span></a>
  <a href="/category.html"><i class="fas fa-th-large"></i><span>Category</span></a>
  <a href="#" onclick="openChatTab(); return false;"><i class="fas fa-envelope"></i><span>Messages</span></a>
  <a href="/cart.html"><i class="fas fa-shopping-cart"></i><span>Cart</span></a>
  <a href="/account.html"><i class="fas fa-user"></i><span>Account</span></a>
</div>

<!-- ===== SCRIPTS ===== -->
<script src="/js/app.js"></script>
<script>
  function togglePassword() {
    const pwd = document.getElementById('loginPassword');
    const icon = document.getElementById('toggleIcon');
    if (pwd.type === 'password') {
      pwd.type = 'text';
      icon.className = 'fas fa-eye-slash';
    } else {
      pwd.type = 'password';
      icon.className = 'fas fa-eye';
    }
  }

  async function handleLogin(e) {
    e.preventDefault();

    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const status = document.getElementById('status');
    const btn = document.getElementById('loginBtn');

    status.className = 'status';
    status.textContent = '';

    if (!email || !password) {
      status.className = 'status error';
      status.textContent = '❌ Email and password are required.';
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Logging in...';
    status.className = 'status loading';
    status.textContent = '⏳ Verifying credentials...';

    try {
      const res = await fetch('/api/auth/business/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();

      if (data.success) {
        status.className = 'status success';
        status.textContent = '✅ Login successful! Redirecting to your business admin...';

        // Store token and business info
        localStorage.setItem('token', data.token);
        localStorage.setItem('customerToken', data.token);
        localStorage.setItem('businessId', data.business_id);
        localStorage.setItem('businessName', data.business_name);

        // FIXED: Redirect to business-admin.html (the full admin panel)
        setTimeout(() => {
          window.location.href = '/business-admin.html';
        }, 1500);
      } else {
        status.className = 'status error';
        status.textContent = '❌ ' + (data.error || 'Invalid credentials. Please try again.');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
      }
    } catch (err) {
      status.className = 'status error';
      status.textContent = '❌ Network error. Please try again.';
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
    }
  }

  // Enter key support
  document.getElementById('loginPassword').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      document.getElementById('loginForm').dispatchEvent(new Event('submit'));
    }
  });
  document.getElementById('loginEmail').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      document.getElementById('loginForm').dispatchEvent(new Event('submit'));
    }
  });
</script>
</body>
</html>
